name: PROOF UI CI/CD

on:
  push:

env:
  GITHUB_TOKEN: ${{ secrets.PROOF_PACKAGE_CI_TOKEN }}

jobs:
  build:
    # if: github.ref_type == 'tag'
    if: github.ref_type != 'tag' && !startsWith(github.event.head_commit.message, 'WIP')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          repository: kit-iai-proof/proof-ci-scripts
          path: ci-scripts
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup path for scripts
        run: echo "$GITHUB_WORKSPACE/ci-scripts" >> "$GITHUB_PATH"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'

      #- name: Check npm version
      #   run: check-npm-git-version-match

      - name: Build npm package
        run: |
          npm install
          npm run build
        env:
          NODE_AUTH_TOKEN: ${{ env.GITHUB_TOKEN }}

  deploy:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
